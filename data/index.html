<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Drum Sequencer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid #1e293b;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f8fafc;
    }

    #status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      transition: all 0.3s ease;
    }

    #status.on {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .voice-row {
      width: 100%;
      max-width: 480px;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 12px;
      background: #111827;
      border: 1px solid #1f2937;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #row-kick {
      --col: #ef4444;
      --bg: rgba(239, 68, 68, 0.05);
    }

    #row-snare {
      --col: #22c55e;
      --bg: rgba(34, 197, 94, 0.05);
    }

    #row-hihat {
      --col: #a855f7;
      --bg: rgba(168, 85, 247, 0.05);
    }

    .voice-row.active-voice {
      background: var(--bg);
      border-color: var(--col);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }

    .voice-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 10px;
      color: #9ca3af;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .voice-row.active-voice .voice-label {
      color: var(--col);
    }

    .voice-label::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: transparent;
    }

    .voice-row.active-voice .voice-label::after {
      background: var(--col);
      box-shadow: 0 0 8px var(--col);
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
    }

    .step {
      aspect-ratio: 1;
      border: 1px solid #374151;
      border-radius: 8px;
      background: #1f2937;
      cursor: pointer;
      min-height: 40px;
      transition: all 0.15s ease;
    }

    .step.active {
      background: var(--col);
      border-color: var(--col);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .step.playhead {
      border: 2px solid #ffffff;
      transform: scale(1.05);
    }

    .bpm-section {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #1e293b;
    }

    .bpm-btn {
      width: 40px;
      height: 40px;
      border: 1px solid #374151;
      border-radius: 50%;
      background: #111827;
      color: #f3f4f6;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .bpm-btn:active {
      transform: scale(0.92);
    }

    .bpm-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #bpm-display {
      font-size: 24px;
      font-weight: 800;
      width: 72px;
      text-align: center;
      background: transparent;
      border: none;
      color: #f8fafc;
      border-bottom: 2px dashed #4b5563;
      outline: none;
      font-variant-numeric: tabular-nums;
    }

    #bpm-display:focus {
      border-bottom-color: #9ca3af;
    }

    #bpm-label {
      font-size: 10px;
      color: #64748b;
      letter-spacing: 2px;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <header>
    <h1>DRUM SEQUENCER</h1>
    <div id="status"></div>
  </header>

  <div class="voice-row" id="row-kick" data-voice="kick">
    <div class="voice-label">KICK</div>
    <div class="steps" id="steps-kick"></div>
  </div>
  <div class="voice-row" id="row-snare" data-voice="snare">
    <div class="voice-label">SNARE</div>
    <div class="steps" id="steps-snare"></div>
  </div>
  <div class="voice-row" id="row-hihat" data-voice="hihat">
    <div class="voice-label">HI-HAT</div>
    <div class="steps" id="steps-hihat"></div>
  </div>

  <div class="bpm-section">
    <button class="bpm-btn" id="bpm-down">&minus;</button>
    <div class="bpm-container">
      <input type="number" id="bpm-display" min="60" max="600" value="120">
      <div id="bpm-label">BPM</div>
    </div>
    <button class="bpm-btn" id="bpm-up">+</button>
  </div>

  <script>
    const state = {
      kick: Array(8).fill(0), snare: Array(8).fill(0), hihat: Array(8).fill(0),
      bpm: 120, step: -1, selectedVoice: 0
    };
    const voices = ["kick", "snare", "hihat"];
    const voiceIdx = { kick: 0, snare: 1, hihat: 2 };
    let ws;

    function init() {
      voices.forEach(v => {
        const row = document.getElementById(`row-${v}`);
        row.addEventListener("click", () => selectVoice(v));

        const container = document.getElementById(`steps-${v}`);
        for (let i = 0; i < 8; i++) {
          const pad = document.createElement("div");
          pad.className = "step";
          pad.dataset.step = i;
          pad.addEventListener("click", (e) => toggleStep(e, v, i));
          container.appendChild(pad);
        }
      });

      document.getElementById("bpm-down").addEventListener("click", () => adjustBpm(-5));
      document.getElementById("bpm-up").addEventListener("click", () => adjustBpm(5));

      const bpmDisp = document.getElementById("bpm-display");
      bpmDisp.addEventListener("change", (e) => {
        let val = parseInt(e.target.value);
        if (isNaN(val)) return e.target.value = state.bpm;
        state.bpm = Math.max(60, Math.min(600, val));
        e.target.value = state.bpm;
        send({ type: "bpm", value: state.bpm });
      });
      bpmDisp.addEventListener("keydown", (e) => { if (e.key === "Enter") bpmDisp.blur(); });

      connect();
    }

    function connect() {
      const host = location.hostname || "192.168.4.1";
      ws = new WebSocket(`ws://${host}/ws`);
      ws.onopen = () => {
        document.getElementById("status").className = "on";
        send({ type: "get_state" });
      };
      ws.onclose = () => {
        document.getElementById("status").className = "";
        setTimeout(connect, 2000);
      };
      ws.onerror = () => ws.close();
      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === "state") {
          state.kick = data.kick; state.snare = data.snare; state.hihat = data.hihat;
          state.bpm = data.bpm;
          if (typeof data.step === "number") state.step = data.step;
          if (typeof data.selectedVoice === "number") state.selectedVoice = data.selectedVoice;
          render();
        } else if (data.type === "step") {
          state.step = data.index;
          renderPlayhead();
        }
      };
    }

    function send(obj) {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
    }

    function selectVoice(v) {
      const idx = voiceIdx[v];
      if (state.selectedVoice !== idx) {
        state.selectedVoice = idx;
        highlightVoice();
        send({ type: "select_voice", voice: idx });
      }
    }

    function toggleStep(e, v, s) {
      e.stopPropagation();
      state[v][s] = state[v][s] ? 0 : 1;
      render();
      send({ type: "toggle", voice: voiceIdx[v], step: s });
      if (state.selectedVoice !== voiceIdx[v]) {
        state.selectedVoice = voiceIdx[v];
        send({ type: "select_voice", voice: voiceIdx[v] });
        highlightVoice();
      }
    }

    function adjustBpm(delta) {
      state.bpm = Math.max(60, Math.min(600, state.bpm + delta));
      document.getElementById("bpm-display").value = state.bpm;
      send({ type: "bpm", value: state.bpm });
    }

    function highlightVoice() {
      voices.forEach(v => {
        document.getElementById(`row-${v}`).classList.toggle("active-voice", voiceIdx[v] === state.selectedVoice);
      });
    }

    function render() {
      voices.forEach(v => {
        const pads = document.getElementById(`steps-${v}`).children;
        for (let i = 0; i < 8; i++) {
          pads[i].className = `step${state[v][i] ? ' active' : ''}`;
        }
      });
      document.getElementById("bpm-display").value = state.bpm;
      highlightVoice();
      renderPlayhead();
    }

    function renderPlayhead() {
      voices.forEach(v => {
        const pads = document.getElementById(`steps-${v}`).children;
        for (let i = 0; i < 8; i++) {
          pads[i].classList.toggle("playhead", i === state.step);
        }
      });
    }

    init();
  </script>
</body>

</html>
