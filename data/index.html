<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Drum Machine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px
    }

    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 8px;
      border-bottom: 1px solid #222;
      margin-bottom: 20px
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(45deg, #fff, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent
    }

    #status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444
    }

    #status.on {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e
    }

    .voice-row {
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #121212;
      border: 1px solid #1e1e1e;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer
    }

    .voice-row:hover {
      background: #161616;
      border-color: #333
    }

    #row-kick {
      --voice-color: #ef4444;
      --voice-bg: rgba(239, 68, 68, 0.06);
      --voice-color-rgb: 239, 68, 68
    }

    #row-snare {
      --voice-color: #22c55e;
      --voice-bg: rgba(34, 197, 94, 0.06);
      --voice-color-rgb: 34, 197, 94
    }

    #row-hihat {
      --voice-color: #a855f7;
      --voice-bg: rgba(168, 85, 247, 0.06);
      --voice-color-rgb: 168, 85, 247
    }

    .voice-row.active-voice {
      background: var(--voice-bg);
      border-color: rgba(var(--voice-color-rgb), 0.3);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.03)
    }

    .voice-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #888;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: color 0.3s ease
    }

    .voice-row.active-voice .voice-label {
      color: var(--voice-color)
    }

    .voice-label::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: transparent;
      transition: all 0.3s ease
    }

    .voice-row.active-voice .voice-label::after {
      background: var(--voice-color);
      box-shadow: 0 0 8px var(--voice-color)
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px
    }

    .step {
      aspect-ratio: 1;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      background: #1a1a1a;
      cursor: pointer;
      position: relative;
      min-width: 0;
      min-height: 44px;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1)
    }

    .step:hover {
      border-color: #444;
      background: #222
    }

    .voice-row.active-voice .step:not(.active) {
      border-color: rgba(var(--voice-color-rgb), 0.2)
    }

    .voice-row.active-voice .step:not(.active):hover {
      border-color: rgba(var(--voice-color-rgb), 0.5);
      background: rgba(var(--voice-color-rgb), 0.03)
    }

    .step.active {
      background: var(--voice-color, #fff);
      border-color: var(--voice-color, #fff);
      box-shadow: 0 0 12px rgba(var(--voice-color-rgb), 0.4)
    }

    .step.playhead {
      border-color: #fff;
      transform: scale(1.05);
      z-index: 2;
      box-shadow: 0 0 0 2px #fff
    }

    .step.active.playhead {
      box-shadow: 0 0 0 2px #fff, 0 0 16px var(--voice-color)
    }

    .bpm-section {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
      padding-top: 20px;
      border-top: 1px solid #222
    }

    .bpm-btn {
      width: 44px;
      height: 44px;
      border: 1px solid #333;
      border-radius: 50%;
      background: #161616;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s ease
    }

    .bpm-btn:hover {
      background: #222;
      border-color: #444
    }

    .bpm-btn:active {
      transform: scale(0.95)
    }

    #bpm-display {
      font-size: 26px;
      font-weight: 800;
      min-width: 80px;
      text-align: center;
      font-variant-numeric: tabular-nums
    }

    #bpm-label {
      font-size: 10px;
      color: #666;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px
    }
  </style>
</head>

<body>
  <header>
    <h1>DRUM MACHINE</h1>
    <div id="status"></div>
  </header>

  <div class="voice-row" id="row-kick" data-voice="kick">
    <div class="voice-label">KICK</div>
    <div class="steps" id="steps-kick"></div>
  </div>
  <div class="voice-row" id="row-snare" data-voice="snare">
    <div class="voice-label">SNARE</div>
    <div class="steps" id="steps-snare"></div>
  </div>
  <div class="voice-row" id="row-hihat" data-voice="hihat">
    <div class="voice-label">HIHAT</div>
    <div class="steps" id="steps-hihat"></div>
  </div>

  <div class="bpm-section">
    <button class="bpm-btn" id="bpm-down">&minus;</button>
    <div>
      <div id="bpm-display">120</div>
      <div id="bpm-label">BPM</div>
    </div>
    <button class="bpm-btn" id="bpm-up">+</button>
  </div>

  <script>
    var ws, state = {
      kick: [0, 0, 0, 0, 0, 0, 0, 0], snare: [0, 0, 0, 0, 0, 0, 0, 0],
      hihat: [0, 0, 0, 0, 0, 0, 0, 0], bpm: 120, step: -1, selectedVoice: 0
    };
    var voices = ["kick", "snare", "hihat"];
    var voiceIdx = { kick: 0, snare: 1, hihat: 2 };

    function init() {
      voices.forEach(function (v) {
        var row = document.getElementById("row-" + v);
        if (row) row.addEventListener("click", onRowClick);

        var c = document.getElementById("steps-" + v);
        for (var i = 0; i < 8; i++) {
          var d = document.createElement("div");
          d.className = "step";
          d.dataset.voice = v;
          d.dataset.step = i;
          d.addEventListener("click", onStep);
          c.appendChild(d);
        }
      });
      document.getElementById("bpm-down").addEventListener("click", function () { changeBpm(-10) });
      document.getElementById("bpm-up").addEventListener("click", function () { changeBpm(10) });
      connect();
    }

    function connect() {
      var h = location.hostname || "192.168.4.1"; // Default softAP IP is 192.168.4.1
      ws = new WebSocket("ws://" + h + "/ws");
      ws.onopen = function () {
        document.getElementById("status").classList.add("on");
        ws.send(JSON.stringify({ type: "get_state" }));
      };
      ws.onclose = function () {
        document.getElementById("status").classList.remove("on");
        setTimeout(connect, 2000);
      };
      ws.onerror = function () { ws.close() };
      ws.onmessage = function (e) {
        var m = JSON.parse(e.data);
        if (m.type === "state") {
          state.kick = m.kick; state.snare = m.snare; state.hihat = m.hihat;
          state.bpm = m.bpm;
          if (typeof m.step === "number") state.step = m.step;
          if (typeof m.selectedVoice === "number") state.selectedVoice = m.selectedVoice;
          render();
        } else if (m.type === "step") {
          state.step = m.index;
          renderPlayhead();
        }
      };
    }

    function onRowClick(e) {
      var v = e.currentTarget.dataset.voice;
      var voiceIdxVal = voiceIdx[v];
      if (state.selectedVoice !== voiceIdxVal) {
        state.selectedVoice = voiceIdxVal;
        highlightActiveVoice();
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: "select_voice", voice: voiceIdxVal }));
        }
      }
    }

    function onStep(e) {
      e.stopPropagation(); // Avoid triggering row click selection
      var v = e.currentTarget.dataset.voice;
      var s = parseInt(e.currentTarget.dataset.step);
      state[v][s] = state[v][s] ? 0 : 1;
      render();
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: "toggle", voice: voiceIdx[v], step: s }));
        // Also select the voice if it wasn't already selected
        if (state.selectedVoice !== voiceIdx[v]) {
          state.selectedVoice = voiceIdx[v];
          ws.send(JSON.stringify({ type: "select_voice", voice: voiceIdx[v] }));
          highlightActiveVoice();
        }
      }
    }

    function changeBpm(d) {
      state.bpm = Math.max(60, Math.min(600, state.bpm + d));
      document.getElementById("bpm-display").textContent = state.bpm;
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: "bpm", value: state.bpm }));
      }
    }

    function highlightActiveVoice() {
      voices.forEach(function (v) {
        var row = document.getElementById("row-" + v);
        if (row) {
          row.classList.toggle("active-voice", voiceIdx[v] === state.selectedVoice);
        }
      });
    }

    function render() {
      voices.forEach(function (v) {
        var pads = document.getElementById("steps-" + v).children;
        for (var i = 0; i < 8; i++) {
          pads[i].classList.toggle("active", !!state[v][i]);
        }
      });
      document.getElementById("bpm-display").textContent = state.bpm;
      highlightActiveVoice();
      renderPlayhead();
    }

    function renderPlayhead() {
      var all = document.querySelectorAll(".step");
      for (var i = 0; i < all.length; i++) {
        all[i].classList.toggle("playhead", parseInt(all[i].dataset.step) === state.step);
      }
    }

    init();
  </script>
</body>

</html>
